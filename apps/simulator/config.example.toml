[backend]
base_url = "http://localhost:8000"
owner_email = "owner@example.com"
owner_password = "change-me"
demo_email = "demo"
demo_password = "demo"
wait_for_setup = true
auto_setup = false
poll_seconds = 3

[simulator]
tick_seconds = 5
seed = 42
state_path = "./state/sim_state.json"
queue_path = "../backend/data/sim_queue.jsonl"
queue_poll_seconds = 2

[calibration]
ph4_voltage = 3.0
ph7_voltage = 2.5
ph9_voltage = 2.0

[[aquariums]]
name = "SIM:Main Tank"
water_type = "fresh"
liters = 120
temperature_min = 22
temperature_max = 26
ph_min = 6.5
ph_max = 7.5
tds_min = 150
tds_max = 350

  [[aquariums.devices]]
  name = "SIM:Main-TempStable"
  pattern = "temp_daily_cycle"

  [[aquariums.devices]]
  name = "SIM:Main-pHDrift"
  pattern = "ph_drift_up"

[[aquariums]]
name = "SIM:Secondary"
water_type = "fresh"
liters = 80
temperature_min = 21
temperature_max = 25
ph_min = 6.2
ph_max = 7.2
tds_min = 120
tds_max = 280

  [[aquariums.devices]]
  name = "SIM:Secondary-Mix"
  pattern = "all_three_mix"
